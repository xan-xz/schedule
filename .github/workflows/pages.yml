name: Publish verified UniFlow candidate
run-name: Publish UniFlow production
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run format:check && npm run guard && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build && npm run guard:artifact && npm run budget
      - name: Lighthouse mobile budgets in a local preview
        run: |
          node scripts/serve.mjs --root dist --port 4174 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for attempt in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/schedule/; then break; fi
            sleep 0.2
          done
          LH_OUTPUT=/tmp/uniflow.lighthouse.json npm run perf -- "http://127.0.0.1:4174/schedule/"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: lighthouse-release-report
          path: /tmp/uniflow.lighthouse.json
          if-no-files-found: ignore
      - name: Verify the exact compiled candidate and offline behavior
        env:
          PW_SERVER_ROOT: dist
        run: npx playwright test tests/e2e/compiled.spec.mjs tests/e2e/release.spec.mjs tests/e2e/clock.spec.mjs tests/e2e/groups.spec.mjs tests/e2e/owner-access.spec.mjs tests/e2e/session.spec.mjs tests/e2e/student.spec.mjs tests/e2e/staff.spec.mjs tests/e2e/staff-accessibility.spec.mjs tests/e2e/templates.spec.mjs tests/e2e/drafts.spec.mjs tests/e2e/personalization.spec.mjs tests/e2e/initial-snapshot.spec.mjs tests/e2e/catalogs.spec.mjs tests/e2e/teaching.spec.mjs tests/e2e/teaching-actions.spec.mjs tests/e2e/lesson-batch.spec.mjs
      - run: node scripts/archive-production.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: immutable-production-archive
          path: .release/upload/
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          include-hidden-files: true
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Publish the checked artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
  record-production:
    needs: [build, deploy]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: immutable-production-archive
          path: release-upload
      - name: Record the immutable successful production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/record-production.mjs --dir release-upload
