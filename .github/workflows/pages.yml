name: Publish reviewed Pages candidate
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "beta preserves the existing root; production replaces it"
        type: choice
        options: [beta, production]
        default: beta
        required: true
      data_sources_reviewed:
        description: "Production only: owner resolved group_schedule vs uf_platform and approved the data migration"
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run format:check && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build selected channel
        env:
          CHANNEL: ${{ inputs.channel }}
          REVIEWED: ${{ inputs.data_sources_reviewed }}
        run: |
          if [ "$CHANNEL" = "production" ]; then
            test "$REVIEWED" = "true" || { echo 'Resolve the data source decision in docs/MERGE_PLAN.md first.'; exit 1; }
            node scripts/build.mjs --channel production --data-decision-reviewed
          else
            npm run build
          fi
      - run: npm run budget
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
