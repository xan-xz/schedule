name: Publish reviewed Pages candidate
run-name: Publish ${{ inputs.channel }} UniFlow
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "beta preserves the existing root; production replaces it"
        type: choice
        options: [beta, production]
        default: beta
        required: true
      data_sources_reviewed:
        description: "Production only: owner resolved group_schedule vs uf_platform and approved the data migration"
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run format:check && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Restore immutable production base for beta
        if: inputs.channel == 'beta'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run production:base
      - name: Build selected channel
        env:
          CHANNEL: ${{ inputs.channel }}
          REVIEWED: ${{ inputs.data_sources_reviewed }}
        run: |
          if [ "$CHANNEL" = "production" ]; then
            test "$REVIEWED" = "true" || { echo 'Resolve the data source decision in docs/MERGE_PLAN.md first.'; exit 1; }
            node scripts/build.mjs --channel production --data-decision-reviewed
          else
            npm run build:beta -- --production-base .release/production-base
          fi
      - run: npm run budget
      - name: Lighthouse mobile budgets before publication
        run: |
          node scripts/serve.mjs --root dist --port 4174 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for attempt in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/schedule/beta/; then break; fi
            sleep 0.2
          done
          LH_OUTPUT=/tmp/uniflow.lighthouse.json npm run perf -- "http://127.0.0.1:4174/schedule/beta/?demo=student"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-release-report
          path: /tmp/uniflow.lighthouse.json
          if-no-files-found: ignore
      - name: Verify compiled candidate routes and offline shell
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          PW_SERVER_ROOT: dist
        run: npx playwright test tests/e2e/compiled.spec.mjs tests/e2e/release.spec.mjs tests/e2e/clock.spec.mjs tests/e2e/groups.spec.mjs tests/e2e/owner-access.spec.mjs tests/e2e/session.spec.mjs
      - name: Archive verified production artifact
        if: inputs.channel == 'production'
        run: node scripts/archive-production.mjs
      - uses: actions/upload-artifact@v4
        if: inputs.channel == 'production'
        with:
          name: immutable-production-archive
          path: .release/upload/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

  record-production:
    if: inputs.channel == 'production'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: immutable-production-archive
          path: release-upload
      - name: Record immutable successful production for future beta builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/record-production.mjs --dir release-upload
