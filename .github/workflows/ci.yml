name: Verify UniFlow
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run guard
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run guard:artifact
      - run: npm run budget
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify the compiled entry, compatibility routes and minute transitions
        env:
          PW_SERVER_ROOT: dist
        run: npx playwright test tests/e2e/compiled.spec.mjs tests/e2e/release.spec.mjs tests/e2e/clock.spec.mjs tests/e2e/groups.spec.mjs tests/e2e/owner-access.spec.mjs tests/e2e/session.spec.mjs tests/e2e/student.spec.mjs tests/e2e/staff.spec.mjs tests/e2e/staff-accessibility.spec.mjs tests/e2e/templates.spec.mjs tests/e2e/drafts.spec.mjs tests/e2e/personalization.spec.mjs tests/e2e/initial-snapshot.spec.mjs tests/e2e/catalogs.spec.mjs tests/e2e/teaching.spec.mjs tests/e2e/teaching-actions.spec.mjs tests/e2e/lesson-batch.spec.mjs tests/e2e/personal-backup.spec.mjs tests/e2e/csv-import.spec.mjs tests/e2e/xlsx-import.spec.mjs tests/e2e/management-calendar.spec.mjs tests/e2e/rollback-preview.spec.mjs tests/e2e/template-backup.spec.mjs tests/e2e/json-import.spec.mjs tests/e2e/transfer.spec.mjs tests/e2e/transfer-replacement.spec.mjs
      - name: Lighthouse mobile budgets
        run: |
          node scripts/serve.mjs --root dist --port 4174 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for attempt in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/schedule/; then break; fi
            sleep 0.2
          done
          LH_REPORT_DIR=/tmp/uniflow-lighthouse npm run perf:gate -- "http://127.0.0.1:4174/schedule/"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: lighthouse-mobile-report
          path: /tmp/uniflow-lighthouse/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: production-site-candidate
          path: dist/
          include-hidden-files: true
