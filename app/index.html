<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7957d5" />
    <meta
      name="description"
      content="UniFlow — текущая и следующая пара, аудитории, учебная неделя и личные задания. Расписание доступно офлайн после первого визита."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://anfwdrcazwbkkayczkxg.supabase.co; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self'; manifest-src 'self'"
    />
    <title>UniFlow — расписание и задания</title>
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script src="./appearance-init.js"></script>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="modulepreload" href="./lib/time.mjs" />
    <link rel="preload" href="./bootstrap.json" as="fetch" crossorigin />
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <a class="skip" href="#main">К содержимому</a>
    <header class="top">
      <a class="brand" href="./">UniFlow</a>
      <p id="identity" class="muted">06-057-25-11 · А</p>
    </header>
    <main id="main" tabindex="-1">
      <h1>Сегодня</h1>
      <div
        class="skeleton"
        aria-label="Расписание загружается"
        aria-busy="true"
      >
        <div></div>
        <div></div>
        <div></div>
      </div>
    </main>
    <footer class="statusbar">
      <span id="sync-status" role="status"></span
      ><button id="refresh" type="button">Обновить</button>
    </footer>
    <nav class="bottom" aria-label="Основные разделы" id="navigation"></nav>
    <div id="update-bar" class="update" hidden></div>
    <p
      id="announcement"
      class="sr-only"
      aria-live="polite"
      aria-atomic="true"
    ></p>
    <p id="toast" class="toast" role="status" hidden></p>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <noscript
      >Для показа расписания включи JavaScript.
      <a href="./seed.json">Скачать данные расписания</a>.</noscript
    >
  </body>
</html>
